<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 158" width="700" height="158">
  <defs>
    <clipPath id="c4">
      <circle cx="278" cy="64" r="60"/>
    </clipPath>
  </defs>

  <!-- "made" wordmark -->
  <text x="6" y="106"
    font-family="'Arial Narrow','Impact',Arial,sans-serif"
    font-weight="900" font-style="italic" font-size="88"
    fill="#111111" letter-spacing="-1">made</text>

  <!-- Blue circle -->
  <circle cx="278" cy="64" r="60" fill="#1BAADE"/>

  <!-- White "4" inside circle -->
  <text x="278" y="106"
    font-family="Impact,'Arial Black',Arial,sans-serif"
    font-size="110" font-weight="900" font-style="italic"
    fill="white" text-anchor="middle"
    clip-path="url(#c4)">4</text>

  <!-- ── DNS ICON: Resolution Chain / Recursive Lookup ── -->
  <!-- Client node (left) -->
  <rect x="362" y="44" width="36" height="28" rx="5" fill="#1BAADE"/>
  <rect x="366" y="49" width="28" height="14" rx="2" fill="white" opacity="0.8"/>
  <rect x="371" y="67" width="18" height="3" rx="1" fill="white" opacity="0.6"/>

  <!-- Arrow: client → resolver -->
  <line x1="400" y1="54" x2="424" y2="46" stroke="#111111" stroke-width="2.5"/>
  <polygon points="424,46 410,50 413,58" fill="#111111"/>

  <!-- Resolver node -->
  <circle cx="437" cy="40" r="14" fill="#1BAADE" stroke="white" stroke-width="2"/>
  <circle cx="437" cy="40" r="6" fill="white"/>

  <!-- Arrow: resolver → root -->
  <line x1="450" y1="32" x2="472" y2="22" stroke="#111111" stroke-width="2.5"/>
  <polygon points="472,22 458,26 462,34" fill="#111111"/>

  <!-- Root DNS server -->
  <circle cx="483" cy="16" r="12" fill="#111111"/>
  <text x="483" y="20" font-family="Arial" font-size="9" font-weight="900" fill="white" text-anchor="middle">.</text>

  <!-- Arrow: root → TLD (down-right) -->
  <line x1="492" y1="24" x2="515" y2="38" stroke="#1BAADE" stroke-width="2.5"/>
  <polygon points="515,38 502,34 505,44" fill="#1BAADE"/>

  <!-- TLD server -->
  <circle cx="523" cy="47" r="12" fill="#1BAADE"/>
  <text x="523" y="51" font-family="Arial" font-size="8" font-weight="900" fill="white" text-anchor="middle">.com</text>

  <!-- Arrow: TLD → authoritative -->
  <line x1="512" y1="54" x2="505" y2="72" stroke="#1BAADE" stroke-width="2.5"/>
  <polygon points="505,72 514,62 520,68" fill="#1BAADE"/>

  <!-- Authoritative server (bottom-right) -->
  <rect x="475" y="78" width="46" height="28" rx="5" fill="#1BAADE"/>
  <text x="498" y="89" font-family="Arial" font-size="7" font-weight="900" fill="white" text-anchor="middle">AUTH</text>
  <text x="498" y="99" font-family="Arial" font-size="7" fill="white" text-anchor="middle">DNS</text>

  <!-- Response arrow back to client -->
  <path d="M 475,92 Q 440,110 400,72" fill="none" stroke="#1BAADE" stroke-width="2.5" stroke-dasharray="6,3"/>
  <polygon points="400,72 414,74 408,64" fill="#1BAADE"/>

  <!-- "DNS" product name -->
  <text x="370" y="136"
    font-family="'Arial Narrow','Impact',Arial,sans-serif"
    font-weight="900" font-style="italic" font-size="44"
    fill="#111111" letter-spacing="4">DNS</text>

  <!-- Blue baseline -->
  <rect x="6" y="141" width="688" height="3.5" fill="#1BAADE"/>
</svg>
