<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 158" width="680" height="158">
  <defs>
    <clipPath id="c1">
      <circle cx="278" cy="64" r="60"/>
    </clipPath>
  </defs>

  <!-- "made" wordmark -->
  <text x="6" y="106"
    font-family="'Arial Narrow','Impact',Arial,sans-serif"
    font-weight="900" font-style="italic" font-size="88"
    fill="#111111" letter-spacing="-1">made</text>

  <!-- Blue circle -->
  <circle cx="278" cy="64" r="60" fill="#1BAADE"/>

  <!-- White "4" inside circle -->
  <text x="278" y="106"
    font-family="Impact,'Arial Black',Arial,sans-serif"
    font-size="110" font-weight="900" font-style="italic"
    fill="white" text-anchor="middle"
    clip-path="url(#c1)">4</text>

  <!-- ── DNS ICON: Hierarchy Tree ── -->
  <!-- Root -->
  <circle cx="430" cy="18" r="8" fill="#1BAADE"/>
  <!-- Root to L2 trunk -->
  <line x1="430" y1="26" x2="430" y2="38" stroke="#1BAADE" stroke-width="3"/>
  <line x1="400" y1="38" x2="462" y2="38" stroke="#1BAADE" stroke-width="3"/>
  <!-- L2 stems -->
  <line x1="400" y1="38" x2="400" y2="50" stroke="#1BAADE" stroke-width="3"/>
  <line x1="462" y1="38" x2="462" y2="50" stroke="#1BAADE" stroke-width="3"/>
  <!-- L2 nodes -->
  <circle cx="400" cy="57" r="7.5" fill="#1BAADE"/>
  <circle cx="462" cy="57" r="7.5" fill="#1BAADE"/>
  <!-- L2 to L3 trunks -->
  <line x1="400" y1="65" x2="400" y2="76" stroke="#1BAADE" stroke-width="2.5"/>
  <line x1="378" y1="76" x2="422" y2="76" stroke="#1BAADE" stroke-width="2.5"/>
  <line x1="378" y1="76" x2="378" y2="86" stroke="#1BAADE" stroke-width="2.5"/>
  <line x1="422" y1="76" x2="422" y2="86" stroke="#1BAADE" stroke-width="2.5"/>
  <line x1="462" y1="65" x2="462" y2="76" stroke="#1BAADE" stroke-width="2.5"/>
  <line x1="444" y1="76" x2="480" y2="76" stroke="#1BAADE" stroke-width="2.5"/>
  <line x1="444" y1="76" x2="444" y2="86" stroke="#1BAADE" stroke-width="2.5"/>
  <line x1="480" y1="76" x2="480" y2="86" stroke="#1BAADE" stroke-width="2.5"/>
  <!-- L3 leaf nodes -->
  <circle cx="378" cy="93" r="6" fill="#1BAADE"/>
  <circle cx="422" cy="93" r="6" fill="#1BAADE"/>
  <circle cx="444" cy="93" r="6" fill="#1BAADE"/>
  <circle cx="480" cy="93" r="6" fill="#1BAADE"/>

  <!-- "DNS" product name -->
  <text x="367" y="133"
    font-family="'Arial Narrow','Impact',Arial,sans-serif"
    font-weight="900" font-style="italic" font-size="44"
    fill="#111111" letter-spacing="4">DNS</text>

  <!-- Blue baseline -->
  <rect x="6" y="141" width="666" height="3.5" fill="#1BAADE"/>
</svg>
